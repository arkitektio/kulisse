[project]
name = "kulisse"
dynamic = ["version"]
description = "device and scene models for arkitekt: self-contained binary glTF with a joint table, authored from URDF and checked before upload"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
# Checking a model, its reference and its blok snippet need nothing but the standard library:
# a viewer, a CI job or a server-side tool can hold a GLB to the rules without numpy.
dependencies = []

[project.urls]
Repository = "https://github.com/arkitektio/kulisse"
Specification = "https://github.com/arkitektio/kulisse/blob/main/KULISSE.md"

[project.optional-dependencies]
# Importing a URDF or Xacro: trimesh builds the primitives and loads mesh files (pycollada for
# .dae), numpy carries the transforms, xacro expands macros.
urdf = ["numpy>=1.26", "pycollada>=0.8", "trimesh>=4", "xacro>=2"]
complete = ["numpy>=1.26", "pycollada>=0.8", "trimesh>=4", "xacro>=2"]

[project.scripts]
kulisse = "kulisse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "python-semantic-release>=9.21.0",
    "ruff>0.11",
    "basedpyright>=1.21",
]

[tool.hatch.build.targets.sdist]
include = ["kulisse"]

[tool.hatch.build.targets.wheel]
include = ["kulisse"]

[tool.basedpyright]
include = ["kulisse"]
exclude = ["**/__pycache__", "tests"]
typeCheckingMode = "strict"
# trimesh and xacro ship no type information, so values that come back through them are Unknown
# whatever kulisse annotates; every other strict rule stays on.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false

[tool.ruff.lint]
extend-select = ["ANN", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "ANN206", "ANN401", "D1", "RUF100"]

[tool.ruff]
line-length = 140

[tool.semantic_release]
# Tag-only releases, as fabriks: the version lives in the git tag, hatch-vcs reads it at build
# time, and PSR is told the new version explicitly so the build is not a .devN local version.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
